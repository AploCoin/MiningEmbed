[platformio]
default_envs = esp32dev

[env]
framework = arduino
extra_scripts = pre:trust_profile.py
monitor_speed = 115200
lib_ldf_mode = deep+
lib_deps =
    symlink://${sysenv.APLOEMBED_PATH}
    symlink://${sysenv.MININGEMBED_PATH}

[env:esp12e]
platform = espressif8266@4.2.1
board = esp12e

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev

[env:esp32-c3-devkitm-1]
platform = espressif32@6.12.0
board = esp32-c3-devkitm-1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
